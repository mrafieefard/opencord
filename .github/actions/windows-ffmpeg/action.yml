name: Use FFmpeg on Windows
description: >
  FFmpeg for the Windows codec layer (docs/decisions.md D35). A pinned asset
  with its checksum, as build_ffmpeg.sh pins its source: BtbN's `latest` tag
  moves under you. It has to be an LGPL **shared** build, never a gpl one.
  LLVM, which FFmpeg's bindings need, is already on windows-latest.
runs:
  using: composite
  steps:
    - name: Use FFmpeg
      shell: pwsh
      run: |
        $url = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-13-13-05/ffmpeg-n9.0.2-27-g7e93014c5b-win64-lgpl-shared-9.0.zip'
        $sha256 = '9df4db960f3f0cd3ed76be0a2be96265d00db4c3be2526a6d39b03c2b547100d'
        $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
        Invoke-WebRequest -Uri $url -OutFile $zip
        $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
        if ($got -ne $sha256) { throw "FFmpeg's zip hashes to $got, not $sha256." }
        Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
        $dir = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'ffmpeg-n9.0.2-*') -Directory)[0].FullName
        "FFMPEG_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File $env:GITHUB_ENV -Append
        Join-Path $dir 'bin' | Out-File $env:GITHUB_PATH -Append
