[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/mrafieefard/opencord"

[workspace.dependencies]
opencord-common = { path = "crates/opencord-common" }
opencord-proto = { path = "crates/opencord-proto" }

bitflags = "2.13.2"
ed25519-dalek = "3.0.0"
flutter_rust_bridge = "=2.13.0"
hex = "0.4.3"
prost = "0.14.4"
prost-build = "0.14.4"
protox = "0.9.1"
thiserror = "2.0.21"
