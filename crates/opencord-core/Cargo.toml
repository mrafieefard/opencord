[package]
# Underscore on purpose: cargokit derives the native library filename from the package name.
name = "opencord_core"
description = "Opencord client core, exposed to the Flutter app through flutter_rust_bridge."
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
data-encoding.workspace = true
flutter_rust_bridge.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
opencord-common.workspace = true
opencord-media.workspace = true
opencord-proto.workspace = true
prost.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
opencord-server.workspace = true
tempfile.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
