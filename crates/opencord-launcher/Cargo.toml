[package]
name = "opencord-launcher"
description = "Opencord's installer and updater: installs the app for the user, keeps it on the newest build of its track, and starts it."
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
ab_glyph = "0.2.32"
data-encoding.workspace = true
ed25519-dalek.workspace = true
flate2 = "1.1.10"
hex.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
rustls.workspace = true
semver = { version = "1.0.28", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
softbuffer = "0.4.8"
tar = "0.4.46"
webpki-roots.workspace = true
winit = "0.30.12"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile.workspace = true
