[package]
name = "opencord-media"
description = "Opencord client media engine: voice transport now, audio and video later."
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
aec3.workspace = true
audio_thread_priority.workspace = true
audioadapter-buffers.workspace = true
bytes.workspace = true
cpal.workspace = true
ebur128.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nnnoiseless.workspace = true
opencord-common = { workspace = true, features = ["str0m"] }
opencord-proto.workspace = true
opus.workspace = true
prost.workspace = true
realfft.workspace = true
rubato.workspace = true
rtrb.workspace = true
rustls.workspace = true
sha2.workspace = true
str0m.workspace = true
str0m-netem = { workspace = true, optional = true }
symphonia.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tract-onnx.workspace = true
tract-pulse.workspace = true

[dev-dependencies]
serde_json.workspace = true
str0m-netem.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[features]
# Test support: the network impairment shim and the XOR frame transform
# (plan §13, §15). Never in release builds.
testing = ["dep:str0m-netem"]

# One section per system (docs/plans/platforms.md): each session edits only
# its own. A crate only one system needs goes here with its version, never
# in [workspace.dependencies].
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
ffmpeg-next.workspace = true
openh264.workspace = true
openh264-sys2.workspace = true
pipewire.workspace = true
v4l.workspace = true
# How long the keyboard and mouse have been idle on Wayland, for AFK moves
# (ext-idle-notify-v1, a staging protocol).
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-media", "objc2-core-graphics", "SCContentSharingPicker", "SCError", "SCShareableContent", "SCStream"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSBundle", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "block2", "dispatch2", "objc2", "objc2-core-audio-types", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3.2", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFMachPort", "CFNotificationCenter", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
pic-scale = { version = "0.7.12", default-features = false, features = ["avx", "neon", "rdm", "sse"] }
yuv = { version = "0.8.19", default-features = false, features = ["avx", "rdm", "sse"] }

[target.'cfg(target_os = "windows")'.dependencies]
# `#[implement]` expands to paths in `windows_core`, so the COM callback
# W7 needs it by name as well as through `windows`. Same version, so it is
# the same crate.
windows-core = "0.62"
# The codec layer, the same crates Linux uses (windows.md W3 step 1).
ffmpeg-next.workspace = true
openh264.workspace = true
openh264-sys2.workspace = true
# cpal's version, so only one copy of it builds (platforms.md §4).
windows = { version = "0.62", features = [
    "Foundation",
    "Wdk_System_SystemServices",
    "Graphics_Capture",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "camera_load"
required-features = ["testing"]

[[example]]
name = "codec_costs"
required-features = ["testing"]

[[example]]
name = "virtual_camera"
required-features = ["testing"]

[[example]]
name = "screen_load"
required-features = ["testing"]
