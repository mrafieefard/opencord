[package]
name = "opencord-media"
description = "Opencord client media engine: voice transport now, audio and video later."
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
aec3.workspace = true
audio_thread_priority.workspace = true
audioadapter-buffers.workspace = true
bytes.workspace = true
cpal.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nnnoiseless.workspace = true
opencord-common = { workspace = true, features = ["str0m"] }
opencord-proto.workspace = true
opus.workspace = true
prost.workspace = true
realfft.workspace = true
rubato.workspace = true
rtrb.workspace = true
rustls.workspace = true
sha2.workspace = true
str0m.workspace = true
str0m-netem = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tract-onnx.workspace = true
tract-pulse.workspace = true

[dev-dependencies]
str0m-netem.workspace = true

[features]
# Test support: the network impairment shim and the XOR frame transform
# (plan §13, §15). Never in release builds.
testing = ["dep:str0m-netem"]

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
ffmpeg-next.workspace = true
openh264.workspace = true
openh264-sys2.workspace = true
pipewire.workspace = true
v4l.workspace = true
x11rb.workspace = true

[[example]]
name = "camera_load"
required-features = ["testing"]

[[example]]
name = "codec_costs"
required-features = ["testing"]

[[example]]
name = "virtual_camera"
required-features = ["testing"]
