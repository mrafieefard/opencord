[package]
name = "opencord-media"
description = "Opencord client media engine: voice transport now, audio and video later."
version.workspace = true
edition.workspace = true
repository.workspace = true
license = "MPL-2.0"
publish = false

[dependencies]
aec3.workspace = true
audio_thread_priority.workspace = true
audioadapter-buffers.workspace = true
bytes.workspace = true
cpal.workspace = true
ebur128.workspace = true
futures-util.workspace = true
getrandom.workspace = true
nnnoiseless.workspace = true
opencord-common = { workspace = true, features = ["str0m"] }
opencord-proto.workspace = true
opus.workspace = true
prost.workspace = true
realfft.workspace = true
rubato.workspace = true
rtrb.workspace = true
rustls.workspace = true
sha2.workspace = true
str0m.workspace = true
str0m-netem = { workspace = true, optional = true }
symphonia.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tract-onnx.workspace = true
tract-pulse.workspace = true

[dev-dependencies]
str0m-netem.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[features]
# Test support: the network impairment shim and the XOR frame transform
# (plan §13, §15). Never in release builds.
testing = ["dep:str0m-netem"]

# One section per system (docs/plans/platforms.md): each session edits only
# its own. A crate only one system needs goes here with its version, never
# in [workspace.dependencies].
[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
ffmpeg-next.workspace = true
openh264.workspace = true
openh264-sys2.workspace = true
pipewire.workspace = true
v4l.workspace = true
x11rb.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-media", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVMediaFormat"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMFormatDescription", "CMSampleBuffer", "CMTime"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSValue"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFMachPort", "CFNotificationCenter", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
pic-scale = { version = "0.7.12", default-features = false, features = ["avx", "neon", "rdm", "sse"] }
yuv = { version = "0.8.19", default-features = false, features = ["avx", "rdm", "sse"] }

[target.'cfg(target_os = "windows")'.dependencies]

[[example]]
name = "camera_load"
required-features = ["testing"]

[[example]]
name = "codec_costs"
required-features = ["testing"]

[[example]]
name = "virtual_camera"
required-features = ["testing"]

[[example]]
name = "screen_load"
required-features = ["testing"]
