<!doctype html>
<!--
  The README's banner and the repository's social preview (1280 x 640).
  chat.png and voice-call.png come from app/test/showcase; voice-call.png
  is the tiles of voice.png. To render it again:

    chromium --headless=new --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1280,640 --screenshot=banner.png banner.html
-->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(../../app/assets/fonts/Inter-Regular.ttf); font-weight: 400; }
@font-face { font-family: Inter; src: url(../../app/assets/fonts/Inter-Medium.ttf); font-weight: 500; }
@font-face { font-family: Inter; src: url(../../app/assets/fonts/Inter-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Inter; src: url(../../app/assets/fonts/Inter-Bold.ttf); font-weight: 700; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body {
  font-family: Inter; color: #EDEDEF;
  background:
    radial-gradient(900px 600px at 0% 0%, rgba(255,255,255,0.07), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(76,141,255,0.10), transparent 60%),
    #0A0A0B;
  position: relative;
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(800px 500px at 20% 40%, black, transparent 75%);
}
.text { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px;
  display: flex; flex-direction: column; justify-content: center; }
.pill { align-self: flex-start; font-size: 13px; font-weight: 500; letter-spacing: .02em;
  color: #A1A1A8; border: 1px solid #27272C; background: rgba(24,24,27,.8);
  padding: 7px 12px; border-radius: 999px; margin-bottom: 22px; }
h1 { font-size: 78px; font-weight: 700; letter-spacing: -0.035em; margin: 0 0 18px; line-height: 1; }
p { font-size: 22px; line-height: 1.45; color: #A1A1A8; margin: 0 0 28px; }
p strong { color: #EDEDEF; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; font-weight: 500; color: #EDEDEF; background: #18181B;
  border: 1px solid #222226; padding: 8px 12px; border-radius: 10px; }
.shot { position: absolute; border-radius: 14px; overflow: hidden;
  border: 1px solid #2A2A30; box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4); }
.shot img { display: block; width: 100%; }
.back { left: 610px; top: 56px; width: 820px; opacity: .85; }
.front { left: 700px; top: 372px; width: 560px; }
</style></head>
<body>
<div class="grid"></div>
<div class="shot back"><img src="chat.png"></div>
<div class="shot front"><img src="voice-call.png"></div>
<div class="text">
  <div class="pill">Open source · Self-hosted</div>
  <h1>Opencord</h1>
  <p>Discord-style servers you run yourself. <strong>Voice, video, screen sharing and private messages</strong>, on your own hardware.</p>
  <div class="chips">
    <span class="chip">Voice &amp; video</span>
    <span class="chip">Screen share</span>
    <span class="chip">Encrypted DMs</span>
    <span class="chip">Music</span>
    <span class="chip">Windows · macOS · Linux</span>
  </div>
</div>
</body></html>
