# uniffi-bindgen-react-native: builds crates/opencord-mobile and generates
# the TypeScript and C++ that install it into React Native (docs/mobile.md).
rust:
  directory: ../../..
  manifestPath: crates/opencord-mobile/Cargo.toml
android:
  targets: [arm64-v8a, x86_64]
  apiLevel: 26
  # A shared library: Rust links Android's own libraries (libandroid, AAudio)
  # into it, which a static library can't carry to CMake.
  useSharedLibrary: true
ios:
  targets: [aarch64-apple-ios, aarch64-apple-ios-sim]
bindings:
  cpp: cpp/generated
  ts: src/generated
