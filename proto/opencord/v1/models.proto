syntax = "proto3";

package opencord.v1;

import "opencord/v1/network.proto";

// All ids are 64-bit Snowflakes. All timestamps are Unix milliseconds.

message User {
  int64 id = 1;
  // Ed25519 public key (32 bytes). This is the user's identity.
  bytes public_key = 2;
  string display_name = 3;
  // SHA-256 (hex) of the profile picture, a 256-pixel square PNG at
  // GET /media/avatars/{hash}; empty for none.
  string avatar_hash = 4;
}

message Member {
  User user = 1;
  optional string nickname = 2;
  // Roles assigned to the member. @everyone is implied and never listed.
  repeated int64 role_ids = 3;
  int64 joined_at_ms = 4;
}

message Role {
  int64 id = 1;
  string name = 2;
  // 0xRRGGBB. 0 means no color.
  uint32 color = 3;
  // @everyone is always 0. Higher positions outrank lower ones.
  int32 position = 4;
  uint64 permissions = 5;
  bool hoist = 6;
  bool mentionable = 7;
  optional uint64 max_upload_bytes = 8;
}

enum ChannelKind {
  CHANNEL_KIND_UNSPECIFIED = 0;
  CHANNEL_KIND_TEXT = 1;
  CHANNEL_KIND_VOICE = 2;
  CHANNEL_KIND_CATEGORY = 3;
}

enum OverwriteTarget {
  OVERWRITE_TARGET_UNSPECIFIED = 0;
  OVERWRITE_TARGET_ROLE = 1;
  OVERWRITE_TARGET_MEMBER = 2;
}

message PermissionOverwrite {
  OverwriteTarget target_kind = 1;
  // A role id or a user id, depending on target_kind.
  int64 target_id = 2;
  uint64 allow = 3;
  uint64 deny = 4;
}

message Channel {
  int64 id = 1;
  ChannelKind kind = 2;
  string name = 3;
  optional string topic = 4;
  // The category this channel sits in.
  optional int64 parent_id = 5;
  int32 position = 6;
  repeated PermissionOverwrite overwrites = 7;
  // Voice channels only; zero or false on other kinds.
  // Audio bitrate in bits per second, capped by the server's maximum.
  uint32 bitrate = 8;
  // At most this many people at once; 0 means no limit.
  uint32 user_limit = 9;
  // Whether the voice channel also holds messages.
  bool text_in_voice = 10;
}

message Message {
  int64 id = 1;
  int64 channel_id = 2;
  int64 author_id = 3;
  string content = 4;
  int64 created_at_ms = 5;
  optional int64 edited_at_ms = 6;
  // Echoed from SendMessage so the sender can match its pending message.
  // Never stored, so it is absent from fetched history.
  optional string nonce = 7;
  // A command's public result (Phase 3 plan §17.3): who ran which.
  optional MessageInteraction interaction = 8;
  repeated Attachment attachments = 9;
}

message MessageInteraction {
  int64 user_id = 1;
  string command = 2;
}

message Invite {
  string code = 1;
  // Absent for invites the server created itself.
  optional int64 created_by = 2;
  int64 created_at_ms = 3;
  // Absent means unlimited.
  optional uint32 max_uses = 4;
  uint32 uses = 5;
  // Absent means the invite never expires.
  optional int64 expires_at_ms = 6;
  // The domain its link uses (Phase 3); absent for links by IP address.
  optional ConnectAddress address = 7;
}

message Ban {
  User user = 1;
  optional string reason = 2;
  optional int64 banned_by = 3;
  int64 created_at_ms = 4;
}

message ServerInfo {
  // 16 random bytes generated on first start.
  bytes server_id = 1;
  string name = 2;
  string description = 3;
  // Absent until someone claims ownership.
  optional int64 owner_id = 4;
  bool open_join = 5;
  int64 everyone_role_id = 6;
  // SHA-256 (hex) of the server's icon, as a profile picture's; empty for
  // none.
  string icon_hash = 7;
}

enum PresenceStatus {
  PRESENCE_STATUS_UNSPECIFIED = 0;
  PRESENCE_STATUS_ONLINE = 1;
  PRESENCE_STATUS_IDLE = 2;
  PRESENCE_STATUS_DND = 3;
  PRESENCE_STATUS_OFFLINE = 4;
}

message Presence {
  int64 user_id = 1;
  PresenceStatus status = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_FORBIDDEN = 2;
  ERROR_CODE_NOT_FOUND = 3;
  ERROR_CODE_INVALID_ARGUMENT = 4;
  ERROR_CODE_RATE_LIMITED = 5;
  ERROR_CODE_INVALID_SESSION = 6;
  ERROR_CODE_CONFLICT = 7;
  ERROR_CODE_INTERNAL = 8;
  ERROR_CODE_VOICE_CHANNEL_FULL = 9;
  // The target, or the caller, is not in a voice channel.
  ERROR_CODE_VOICE_NOT_CONNECTED = 10;
  // A stream or track asks for more than the server allows.
  ERROR_CODE_QUALITY_LIMIT = 11;
  ERROR_CODE_CAMERA_LIMIT = 12;
  ERROR_CODE_STREAM_VIEWER_LIMIT = 13;
  // Wait before playing another sound, or too many are playing.
  ERROR_CODE_SOUND_COOLDOWN = 14;
  ERROR_CODE_SOUND_TOO_LONG = 15;
  ERROR_CODE_SOUND_INVALID = 16;
  ERROR_CODE_SOUNDBOARD_FULL = 17;
  // Phase 3, domains and certificates.
  ERROR_CODE_DOMAIN_INVALID = 18;
  ERROR_CODE_DOMAIN_EXISTS = 19;
  ERROR_CODE_DOMAIN_LIMIT = 20;
  ERROR_CODE_DOMAIN_NOT_VERIFIED = 21;
  ERROR_CODE_DNS_MISMATCH = 22;
  ERROR_CODE_ACME_FAILED = 23;
  ERROR_CODE_ACME_RATE_LIMITED = 24;
  ERROR_CODE_PORT_UNREACHABLE = 25;
  // Phase 3, music (§18.5).
  ERROR_CODE_MUSIC_NOT_CONFIGURED = 26;
  ERROR_CODE_MUSIC_NODE_UNAVAILABLE = 27;
  ERROR_CODE_MUSIC_NOT_IN_CHANNEL = 28;
  ERROR_CODE_MUSIC_BLOCKED = 29;
  ERROR_CODE_MUSIC_QUEUE_FULL = 30;
  ERROR_CODE_MUSIC_MEMBER_LIMIT = 31;
  ERROR_CODE_MUSIC_TRACK_TOO_LONG = 32;
  ERROR_CODE_MUSIC_STREAMS_NOT_ALLOWED = 33;
  ERROR_CODE_MUSIC_SOURCE_NOT_ALLOWED = 34;
  ERROR_CODE_MUSIC_LINK_NOT_ALLOWED = 35;
  // Another item plays now than the action expected.
  ERROR_CODE_MUSIC_STALE = 36;
  // Chat commands (Phase 3 plan §17.5).
  ERROR_CODE_COMMAND_UNKNOWN = 37;
  ERROR_CODE_COMMAND_DISABLED = 38;
  ERROR_CODE_COMMAND_NOT_ALLOWED_HERE = 39;
  ERROR_CODE_COMMAND_INVALID_OPTIONS = 40;
  // Media uploads (design 2026-10-18).
  ERROR_CODE_FILE_TOO_LARGE = 41;
  ERROR_CODE_FILE_TYPE_BLOCKED = 42;
  ERROR_CODE_UPLOAD_OFFSET_MISMATCH = 43;
  ERROR_CODE_STORAGE_UNAVAILABLE = 44;
  ERROR_CODE_STORAGE_FULL = 45;
  ERROR_CODE_VOICE_MESSAGE_INVALID = 46;
  ERROR_CODE_VOICE_MESSAGE_TOO_LONG = 47;
  // Private messages and friends (design 2026-10-22).
  ERROR_CODE_FRIEND_REQUESTS_CLOSED = 48;
  ERROR_CODE_MESSAGE_REQUESTS_CLOSED = 49;
  ERROR_CODE_UNDELIVERABLE = 50;
  ERROR_CODE_DEVICE_LIST_CHANGED = 51;
  ERROR_CODE_PRIVATE_MESSAGES_UNAVAILABLE = 52;
  // The server relays private messages only between friends.
  ERROR_CODE_FRIENDS_ONLY = 53;
}

message Error {
  ErrorCode code = 1;
  // Human-readable, for logs and UI. Do not match on it.
  string message = 2;
  // Set with ERROR_CODE_RATE_LIMITED.
  optional uint64 retry_after_ms = 3;
}

// Someone's presence in a voice channel. Lives in server memory only.
message VoiceState {
  int64 user_id = 1;
  // Absent once the user has left.
  optional int64 channel_id = 2;
  // The gateway session that holds this voice state.
  string session_id = 3;
  bool self_mute = 4;
  bool self_deaf = 5;
  bool server_mute = 6;
  bool server_deaf = 7;
  // Set without SPEAK in the channel, or in the AFK channel.
  bool suppress = 8;
  bool self_video = 9;
  bool self_stream = 10;
}

// A screen share preset is a maximum pixel count, not a fixed size.
enum ScreenShareResolution {
  SCREEN_SHARE_RESOLUTION_UNSPECIFIED = 0;
  // 854 x 480
  SCREEN_SHARE_RESOLUTION_480P = 1;
  // 1280 x 720
  SCREEN_SHARE_RESOLUTION_720P = 2;
  // 1920 x 1080
  SCREEN_SHARE_RESOLUTION_1080P = 3;
  // 2560 x 1440
  SCREEN_SHARE_RESOLUTION_1440P = 4;
  // The source's own size.
  SCREEN_SHARE_RESOLUTION_SOURCE = 5;
}

// Server-wide voice, video and soundboard settings.
message VoiceSettings {
  ScreenShareResolution screen_share_max_resolution = 1;
  // 15, 30 or 60.
  uint32 screen_share_max_fps = 2;
  // 1 to 200.
  uint32 max_stream_viewers = 3;
  bool camera_allowed = 4;
  // People with their camera on in one channel, 1 to 50.
  uint32 max_camera_participants = 5;
  // Bits per second, 32 000 to 256 000. Caps every channel's bitrate.
  uint32 max_voice_bitrate = 6;
  // A voice channel where idle people are moved; absent for none.
  optional int64 afk_channel_id = 7;
  // 60, 300, 900, 1 800 or 3 600.
  uint32 afk_timeout_s = 8;
  bool soundboard_enabled = 9;
  bool allow_default_sounds = 10;
  bool allow_external_sounds = 11;
  // Per user, 0 to 30.
  uint32 sound_cooldown_s = 12;
  // Sounds this server can hold, 0 to 200.
  uint32 max_sounds = 13;
}

enum StreamSourceKind {
  STREAM_SOURCE_KIND_UNSPECIFIED = 0;
  STREAM_SOURCE_KIND_SCREEN = 1;
  STREAM_SOURCE_KIND_WINDOW = 2;
}

// A screen share in progress.
message Stream {
  // "stream:<channel_id>:<user_id>".
  string stream_key = 1;
  int64 channel_id = 2;
  int64 user_id = 3;
  StreamSourceKind source_kind = 4;
  ScreenShareResolution resolution = 5;
  uint32 fps = 6;
  bool has_audio = 7;
  uint32 viewer_count = 8;
}

// A server's soundboard sound. The file is at /media/sounds/<sha256 hex>.
message SoundboardSound {
  int64 id = 1;
  string name = 2;
  optional string emoji = 3;
  // 0 to 100 percent.
  uint32 volume = 4;
  // SHA-256 of the Ogg Opus file.
  bytes sha256 = 5;
  uint32 size_bytes = 6;
  uint32 duration_ms = 7;
  optional int64 uploader_id = 8;
  int64 created_at_ms = 9;
}

// Bearer token for the media HTTP endpoints.
message MediaToken {
  string token = 1;
  int64 expires_at_ms = 2;
}

// Media uploads (design 2026-10-18).
enum AttachmentKind {
  ATTACHMENT_KIND_UNSPECIFIED = 0;
  ATTACHMENT_KIND_FILE = 1;
  ATTACHMENT_KIND_IMAGE = 2;
  ATTACHMENT_KIND_VIDEO = 3;
  ATTACHMENT_KIND_AUDIO = 4;
  ATTACHMENT_KIND_VOICE_MESSAGE = 5;
  // A song for the music player (CreateUpload only): channel_id is the
  // voice channel; no message is made from it.
  ATTACHMENT_KIND_MUSIC = 6;
}

message Attachment {
  int64 id = 1;
  string filename = 2;
  // Chosen by the server from the file's first bytes.
  string content_type = 3;
  uint64 size_bytes = 4;
  AttachmentKind kind = 5;
  // Images: stored after EXIF orientation. Videos: the sender's hints.
  optional uint32 width = 6;
  optional uint32 height = 7;
  // Videos (hint) and voice messages (measured).
  optional uint32 duration_ms = 8;
  // Voice messages: 128 values, 0-255, computed by the server.
  bytes waveform = 9;
  bool has_thumbnail = 10;
  optional uint32 thumbnail_width = 11;
  optional uint32 thumbnail_height = 12;
  // Multi-frame GIF or WebP.
  bool animated = 13;
}

message UploadSettings {
  // Lowercase, without a leading dot; may hold inner dots ("tar.gz").
  repeated string blocked_extensions = 1;
  // Always 1800 (30 minutes); servers before it was fixed could set it.
  uint32 voice_message_max_seconds = 2;
  // [uploads] max_file_mb in bytes: the owner's limit and every role
  // limit's ceiling.
  uint64 max_file_bytes = 3;
  uint32 max_attachments = 4;
  uint32 piece_bytes = 5;
}

enum UploadState {
  UPLOAD_STATE_UNSPECIFIED = 0;
  UPLOAD_STATE_UPLOADING = 1;
  UPLOAD_STATE_PROCESSING = 2;
  UPLOAD_STATE_READY = 3;
  UPLOAD_STATE_FAILED = 4;
  UPLOAD_STATE_SENT = 5;
}

// The answer to CreateUpload.
message Upload {
  int64 upload_id = 1;
  uint32 piece_bytes = 2;
}

// The HTTP upload endpoints' answer.
message UploadStatus {
  int64 upload_id = 1;
  UploadState state = 2;
  uint64 received_bytes = 3;
  // When ready (or sent).
  optional Attachment attachment = 4;
  // When failed.
  optional Error error = 5;
}

enum StorageKind {
  STORAGE_KIND_UNSPECIFIED = 0;
  STORAGE_KIND_LOCAL = 1;
  STORAGE_KIND_S3 = 2;
}

message S3Config {
  // https://… (http:// only with allow_http).
  string endpoint = 1;
  string region = 2;
  string bucket = 3;
  string key_prefix = 4;
  bool path_style = 5;
  bool allow_http = 6;
  // In answers: masked to its last 4 characters ("••••WXYZ"). Empty in
  // UpdateStorage keeps the stored one.
  string access_key_id = 7;
  // Write-only: always empty in answers. Empty in UpdateStorage keeps the
  // stored one, unless access_key_id changes.
  string secret_access_key = 8;
}

message StorageBackend {
  int64 id = 1;
  StorageKind kind = 2;
  string name = 3;
  bool active = 4;
  optional S3Config s3 = 5;
  bool has_secret = 6;
  uint64 file_count = 7;
  uint64 bytes = 8;
  optional string last_error = 9;
}

message StorageMove {
  int64 to_storage_id = 1;
  bool running = 2;
  uint64 files_done = 3;
  uint64 files_total = 4;
  uint64 bytes_done = 5;
  uint64 bytes_total = 6;
  uint32 failed = 7;
}

message Storage {
  repeated StorageBackend backends = 1;
  optional StorageMove move = 2;
  // Free space where uploads are received.
  uint64 temp_free_bytes = 3;
}

message StorageTestStep {
  string name = 1;
  bool ok = 2;
  string detail = 3;
}

message StorageTest {
  repeated StorageTestStep steps = 1;
  bool ok = 2;
}
